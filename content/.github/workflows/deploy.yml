name: Deploy Wiki to Quartz
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wiki
        uses: actions/checkout@v4

      - name: Lint notes
        run: |
          echo "=== Notes missing 'title' in frontmatter ==="
          grep -rL "^title:" --include="*.md" . \
            | grep -v "raw/" | grep -v ".obsidian/" | grep -v "copilot/" | grep -v "00-Meta/" \
            || echo "All clean."

          echo "=== Unresolved template placeholders ==="
          grep -rn "{{" --include="*.md" . \
            | grep -v ".quartz-temp/" | grep -v "CLAUDE.md" \
            || echo "All clean."

          echo "=== Broken wikilinks (targets that don't exist as files) ==="
          grep -roh '\[\[[^\]|]*' --include="*.md" . \
            | grep -v "raw/" | grep -v ".obsidian/" | grep -v "copilot/" | grep -v "00-Meta/" \
            | sed 's/.*:\[\[//' | sort -u > /tmp/linked.txt
          find . -maxdepth 2 -name "*.md" \
            | grep -v "raw/" | grep -v ".obsidian/" | grep -v "copilot/" | grep -v "00-Meta/" \
            | sed 's|./||;s|.md$||' | sort > /tmp/existing.txt
          comm -23 /tmp/linked.txt /tmp/existing.txt | grep -v "^$" | grep -v "/" \
            && echo "WARNING: broken wikilinks above — targets not found" || echo "All clean."

      - name: Push to Quartz
        run: |
          # 1. Identity setup
          git config --global user.name "Wiki Bot"
          git config --global user.email "bot@wiki.com"
          
          # 2. Clone your Quartz repo into a HIDDEN folder
          # (Folders starting with '.' are ignored by the copy command below)
          git clone https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository_owner }}/quartz.git .quartz-temp
          
          # 3. Clean out the website's content folder
          rm -rf .quartz-temp/content/*
          
          # 4. Copy your notes into the website folder, excluding private folders
          rsync -av \
            --exclude='raw/' \
            --exclude='copilot/' \
            --exclude='00-Meta/' \
            --exclude='CLAUDE.md' \
            --exclude='Welcome.md' \
            --exclude='Test.md' \
            --exclude='new test note.md' \
            --exclude='.obsidian/' \
            --exclude='*.DS_Store' \
            ./ .quartz-temp/content/ 2>/dev/null || true
          
          # 5. Commit and Push
          cd .quartz-temp
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update content from Obsidian"
            git push
          fi
