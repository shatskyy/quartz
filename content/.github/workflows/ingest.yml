name: Ingest Raw Submissions

on:
  push:
    branches: [main]
    paths:
      - 'raw/**'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new raw files
        id: find
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'raw/*.md' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Found: $FILES"

      - name: Process with Gemini
        if: steps.find.outputs.files != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CLAUDE_MD=$(cat CLAUDE.md)
          BRANCH="ingest/$(date +%Y-%m-%d-%H%M)"

          git config user.name "Wiki Bot"
          git config user.email "bot@wiki.com"
          git checkout -b "$BRANCH"

          for RAW_FILE in ${{ steps.find.outputs.files }}; do
            [ -f "$RAW_FILE" ] || continue
            RAW_CONTENT=$(cat "$RAW_FILE")

            PROMPT=$(cat <<EOF
          You are a wiki librarian. Follow the rules in CLAUDE.md exactly.

          CLAUDE.md:
          ${CLAUDE_MD}

          ---

          A new raw submission has arrived. Process it according to CLAUDE.md rules.

          Raw file: ${RAW_FILE}
          Content:
          ${RAW_CONTENT}

          ---

          Respond with ONLY a JSON object in this exact format, no markdown fences:
          {
            "notes": [
              {
                "filename": "note-slug.md",
                "action": "create" | "update",
                "content": "full file content including YAML frontmatter"
              }
            ],
            "delete_raw": true,
            "index_update": "full updated content of index.md or null if no change needed",
            "pr_title": "ingest: one-line summary",
            "pr_body": "What was submitted, what notes were created/updated"
          }
          EOF
          )

            RESPONSE=$(curl -s \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-04-17:generateContent?key=${GEMINI_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "{\"contents\":[{\"parts\":[{\"text\":$(echo "$PROMPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}]}]}")

            TEXT=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          print(r['candidates'][0]['content']['parts'][0]['text'])
          ")

            echo "$TEXT" > /tmp/gemini_result.json

            python3 <<PYEOF
          import json, os, sys

          with open('/tmp/gemini_result.json') as f:
              raw = f.read().strip()

          # Strip markdown fences if present
          if raw.startswith('\`\`\`'):
              raw = '\n'.join(raw.split('\n')[1:])
          if raw.endswith('\`\`\`'):
              raw = '\n'.join(raw.split('\n')[:-1])

          data = json.loads(raw)

          for note in data.get('notes', []):
              fname = note['filename']
              os.makedirs(os.path.dirname(fname) if '/' in fname else '.', exist_ok=True)
              with open(fname, 'w') as f:
                  f.write(note['content'])
              print(f"Wrote {fname}")

          if data.get('delete_raw'):
              raw_file = '${RAW_FILE}'
              if os.path.exists(raw_file):
                  os.remove(raw_file)
                  print(f"Deleted {raw_file}")

          if data.get('index_update'):
              with open('index.md', 'w') as f:
                  f.write(data['index_update'])
              print("Updated index.md")

          with open('/tmp/pr_meta.json', 'w') as f:
              json.dump({'title': data.get('pr_title', 'ingest: new note'), 'body': data.get('pr_body', '')}, f)
          PYEOF

          done

          git add -A
          git diff --staged --quiet && echo "Nothing to commit" && exit 0

          PR_TITLE=$(python3 -c "import json; d=json.load(open('/tmp/pr_meta.json')); print(d['title'])")
          PR_BODY=$(python3 -c "import json; d=json.load(open('/tmp/pr_meta.json')); print(d['body'])")

          git commit -m "$PR_TITLE"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} "$BRANCH"

          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH"
